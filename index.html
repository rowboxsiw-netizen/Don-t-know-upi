    <script>
      tailwind.config = {
        darkMode: 'class',

          extend: {
            colors: {
              primary: '#6366f1',

              accent: '#f43f5e',

                light: '#f8fafc',
                dark: '#0f172a'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],

            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 7s infinite',

            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },

            }

        }
